<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3F9E"/>
      <stop offset="1" stop-color="#1B1D4A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD3FF"/>
      <stop offset="1" stop-color="#4A7BFF"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FF7A7A"/>
      <stop offset="1" stop-color="#E5262E"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- macOS 風格圓角方形底 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- 旋轉箭頭（兩段弧） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" opacity="0.95">
    <path d="M 512 222 A 290 290 0 0 1 790 430" marker-end="url(#arrow)"/>
    <path d="M 512 802 A 290 290 0 0 1 234 594" marker-end="url(#arrow)"/>
  </g>

  <!-- 平板（稍微傾斜，表示旋轉中） -->
  <g transform="rotate(-18 512 512)" filter="url(#shadow)">
    <rect x="352" y="292" width="320" height="440" rx="44" fill="#F4F5FA"/>
    <rect x="374" y="316" width="276" height="392" rx="26" fill="url(#screen)"/>
    <!-- 錄影紅點 -->
    <circle cx="512" cy="512" r="70" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="512" cy="512" r="54" fill="url(#dot)"/>
  </g>
</svg>
