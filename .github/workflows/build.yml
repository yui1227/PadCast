name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 發 Release 需要

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build PadCast.app (universal)
        run: |
          chmod +x build.sh
          ./build.sh
          lipo -archs PadCast.app/Contents/MacOS/PadCast

      - name: Zip
        run: ditto -c -k --keepParent PadCast.app PadCast.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PadCast
          path: PadCast.zip

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PadCast.zip
          generate_release_notes: true
