name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]   # 在 GitHub 網頁或 API 發佈 Release 時也會自動建置並附上 zip
  workflow_dispatch:

permissions:
  contents: write   # 發 Release 需要

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build PadCast.app (universal)
        run: |
          chmod +x build.sh
          ./build.sh
          lipo -archs PadCast.app/Contents/MacOS/PadCast

      - name: Engine tests
        # GitHub 的 macOS 虛擬機不一定有硬體編碼器（特別是 HEVC），測試失敗不擋建置
        continue-on-error: true
        timeout-minutes: 5   # 虛擬機的編碼器偶爾會卡住，超時就略過，不擋建置
        run: |
          chmod +x Tests/run-tests.sh
          ./Tests/run-tests.sh

      - name: Zip
        run: ditto -c -k --keepParent PadCast.app PadCast.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PadCast
          path: PadCast.zip

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PadCast.zip
          generate_release_notes: true
